
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 650px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
            color: #2563eb;
        }

        p {
            color: #666;
            margin-bottom: 35px;
        }

        .links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 30px 20px;
            width: 260px;
            border-radius: 15px;
            text-decoration: none;
            color: #222;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .card h2 {
            font-size: 19px;
            margin-bottom: 10px;
        }

        .card span {
            font-size: 14px;
            color: #777;
        }

        footer {
            margin-top: 40px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Sito github</h1>
        <p>Pagina principale</p>

        <div class="links">

            <a class="card"
               href="http://holamundo.altervista.org"
               target="_blank"
               rel="noopener noreferrer">

                <div class="icon">🌐</div>
                <h2>Altervista</h2>
                <span>Sito di altervista</span>

            </a>

            <a class="card"
               href="http://192.168.112.203"
               target="_blank"
               rel="noopener noreferrer">

                <div class="icon">💻</div>
                <h2>Localhost</h2>
                <span>Accesso con xampp</span>

            </a>

        </div>

    </div>

</body>
</html>
